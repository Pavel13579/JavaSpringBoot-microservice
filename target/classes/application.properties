# H2 memóriában futó adatbázis beállítása
spring.datasource.url=jdbc:h2:mem:dogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Táblák létrehozása a Hibernate által
spring.jpa.hibernate.ddl-auto=update

# FONTOS: Megvárjuk, amíg a Hibernate létrehozza a táblákat, és csak utána futtatjuk a data.sql-t
spring.jpa.defer-datasource-initialization=true

# Konzolt elérhetővé tesszük
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL inicializáció bekapcsolása
spring.sql.init.mode=always