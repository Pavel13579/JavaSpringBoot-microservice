# H2 adatbázis alapok
spring.datasource.url=jdbc:h2:mem:dogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.settings.web-allow-others=true

# 1. LIQUIBASE BEÁLLÍTÁSA (Ez váltja ki a ddl-auto-t és az SQL init-et)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# 2. HIBERNATE BEÁLLÍTÁSA
# 'validate' módban csak ellenőrzi, hogy a Liquibase jól hozta-e létre a táblákat
spring.jpa.hibernate.ddl-auto=validate

# 3. KIKAPCSOLJUK A RÉGI SQL INIT-ET (Hogy ne legyen ütközés)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 4. H2 KONZOL (Fejlesztéshez hasznos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 5. NAPLÓZÁS (Opcionális, de segít látni mi történik)
logging.level.org.liquibase=INFO